name: 校验经验包

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 结构、链接与隐私校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 校验结构、语言、链接与隐私
        run: python scripts/validate_pack.py
